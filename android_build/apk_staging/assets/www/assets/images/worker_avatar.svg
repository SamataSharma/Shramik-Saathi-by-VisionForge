    <!-- Hair & Beard -->
    <path d="M40 48 Q60 22 80 48 Q78 30 60 30 Q42 30 40 48 Z" fill="#171717"/>
    <path d="M42 58 Q60 80 78 58 Q70 74 60 74 Q50 74 42 58 Z" fill="#171717"/>

  <line x1="120" y1="20" x2="150" y2="160" stroke="#f59e0b" stroke-width="4"/>
  <line x1="60" y1="70" x2="140" y2="70" stroke="#d97706" stroke-width="3"/>
  <line x1="65" y1="110" x2="135" y2="110" stroke="#d97706" stroke-width="3"/>

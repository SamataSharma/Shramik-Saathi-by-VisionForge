  <!-- Text HUD -->
  <rect x="68" y="145" width="64" height="18" rx="4" fill="#dc2626"/>
  <text x="100" y="158" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">SPARK HAZARD</text>
</svg>